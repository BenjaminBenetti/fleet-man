name: Unit Tests

# Fast, docker-free checks. Runs in parallel with the integration jobs so a
# PR fails immediately on a broken unit test rather than waiting 5+ minutes
# for the devcontainer suite to spin up.

on:
  pull_request:
    branches: [main, feat/kubernetes]
  # feat/kubernetes is a long-lived integration branch that work merges into
  # directly, so its pushes run the suite too.
  push:
    branches: [feat/kubernetes]

# Serialize branch pushes: a newer push replaces a queued run but never cancels
# one in flight. PR runs keep one group per run, so they never wait on each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      # Enforces the client/server import boundary (depguard, .golangci.yml).
      # Pinned to the version validated locally; the install script matches the
      # v2 config schema. Currently scoped to internal/fleetclient; the
      # internal/cli and internal/tui globs join as their backend access moves
      # onto the Exec/Logs/PortForward RPCs (Phase 5).
      - name: golangci-lint (import boundary)
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # The routing regressions need live streams: module-presence checks and
      # mocked pactl cannot detect PulseAudio moving a recorder to the mic.
      - name: Install PulseAudio for audio routing tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils

      - name: go test
        env:
          FLEET_TEST_REQUIRE_PULSE: "1"
        run: go test ./...
