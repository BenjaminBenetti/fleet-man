name: Release

on:
  push:
    tags:
      # Stable release, e.g. v1.2.3 — published and marked "Latest".
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Beta release, e.g. v1.2.3-beta — published the same way but NOT marked
      # "Latest" (so `install.sh`, which hits /releases/latest, keeps the stable
      # line), and the public landing page is not redeployed to the beta version.
      - "v[0-9]+.[0-9]+.[0-9]+-beta"

permissions:
  contents: write
  pages: write
  id-token: write
  # Push the fleet-gateway image to the GitHub Container Registry.
  packages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The static tmux bundle shipped beside fleet-pod for pod images without a
  # tmux, one per arch, each built and smoke-tested on its own hardware (under
  # QEMU the arm64 build takes half an hour).
  pod-tmux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the tmux bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: make pod-tmux POD_ARCHES="$ARCH" POD_BIN_DIR=dist

      - name: Smoke-test it on other distros
        env:
          ARCH: ${{ matrix.arch }}
        run: make check-pod-tmux POD_ARCHES="$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: fleet-tmux-linux-${{ matrix.arch }}
          path: dist/fleet-tmux-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    needs: pod-tmux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # fleet-<os>-<arch> for linux and darwin, plus fleet-pod-linux-<arch>
      # (-tags nok8s, no client-go) for fleetd to stage into Kubernetes pods.
      # Every build is CGO_ENABLED=0, so the linux binaries are static and run
      # on any distro or image, musl included. See the Makefile's dist target.
      - name: Build binaries
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          pattern: fleet-tmux-linux-*
          path: dist
          merge-multiple: true

      - name: Check binaries
        run: |
          make check-static
          make check-nok8s

      - name: Checksums
        run: |
          cd dist
          sha256sum fleet-* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A -beta tag publishes a normal release but marks it as a pre-release
          # and NOT "Latest", so the default install (install.sh -> /releases/latest,
          # which excludes pre-releases) keeps getting the stable line. A stable
          # tag is unchanged: gh's default "Latest" handling applies.
          extra_args=""
          case "${GITHUB_REF_NAME}" in
            *-beta) extra_args="--prerelease --latest=false" ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "Fleet ${GITHUB_REF_NAME}" \
            --generate-notes \
            ${extra_args} \
            dist/*

  pages:
    needs: release
    # Beta releases must not become the public-facing version: skip the landing
    # page redeploy so the site keeps advertising the latest stable.
    if: ${{ !endsWith(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site with version injection
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p _site
          cp -r web/. _site/

          # Inject a runtime placeholder-replacement script before </body>.
          # Walks all text nodes and swaps ${version} with the release tag.
          python3 - <<'PY'
          import os

          # Strip leading "v" — the landing page already prefixes the version.
          version = os.environ["VERSION"].lstrip("v")
          path = "_site/index.html"

          script = (
              "<script>\n"
              "(function () {\n"
              f"  var v = {version!r};\n"
              "  var token = '${version}';\n"
              "  function replace() {\n"
              "    if (!document.body) return;\n"
              "    var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);\n"
              "    var n;\n"
              "    while ((n = w.nextNode())) {\n"
              "      if (n.nodeValue.indexOf(token) !== -1) {\n"
              "        n.nodeValue = n.nodeValue.split(token).join(v);\n"
              "      }\n"
              "    }\n"
              "  }\n"
              "  // The bundler swaps document.documentElement wholesale, so any\n"
              "  // MutationObserver attached to the old tree dies with it. Poll\n"
              "  // the live document.body for ~30s instead — the closure survives\n"
              "  // the swap even though the script element does not.\n"
              "  replace();\n"
              "  var attempts = 0;\n"
              "  var iv = setInterval(function () {\n"
              "    attempts++;\n"
              "    replace();\n"
              "    if (attempts > 150) clearInterval(iv);\n"
              "  }, 200);\n"
              "})();\n"
              "</script>\n"
          )

          with open(path, "r", encoding="utf-8") as f:
              html = f.read()

          if "</body>" in html:
              html = html.replace("</body>", script + "</body>", 1)
          else:
              html += "\n" + script

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Build and publish the fleet-gateway image to ghcr alongside the release, so
  # tagging a new version also ships a matching gateway image. The gateway is the
  # same `fleet` binary run as `fleet gateway` (see deploy/gateway/Dockerfile).
  # Independent of the `release` job — it has no `needs`, so a slow/failed binary
  # release doesn't block the image and vice-versa.
  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The workflow-level concurrency group is "pages" and conceptually about the
    # Pages deploy; give the image publish its own per-ref group so it's never
    # cancelled mid-push (a cancel between build and push leaves ghcr with an
    # incomplete image). Same reasoning as qa-image.yml.
    concurrency:
      group: gateway-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Keep the image's Go in lockstep with the repo, exactly as qa-image.yml does.
      - name: Resolve Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2; exit}' go.mod)" >> "$GITHUB_OUTPUT"

      # ghcr image names must be lowercase; the owner (BenjaminBenetti) is not.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/gateway" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # SemVer tags strip the leading "v". A pre-release (-beta) gets only the
          # full version tag — metadata-action skips {{major}}.{{minor}} and the
          # moving "latest" tag for pre-releases (latest=auto), so betas never
          # become the default `:latest` pull, mirroring the release job.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=auto

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
