name: Integration Tests

on:
  pull_request:
    branches: [main, feat/kubernetes]
  # feat/kubernetes is a long-lived integration branch that work merges into
  # directly, so its pushes run the suite too.
  push:
    branches: [feat/kubernetes]

# Serialize branch pushes: a newer push replaces a queued run but never cancels
# one in flight. PR runs keep one group per run, so they never wait on each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # The suite is sharded by test-number range across parallel runners so the
  # SLOWEST shard — not the whole 80+-test suite — sets the wall-clock. Each
  # shard runs integration/run.sh with FLEET_ITEST_RANGE; run.sh filters to the
  # tests whose numeric filename prefix falls in [START, END). The open-ended
  # last shard ("760-") catches any future high-numbered tests so none are dropped.
  integration-shard:
    name: integration ${{ matrix.range }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Run every shard to completion even if one fails — we want the full
      # pass/fail picture across the suite, not a first-failure abort.
      fail-fast: false
      matrix:
        range:
          - "0-100"
          - "100-200"
          - "200-300"
          - "300-400"
          - "400-500"
          - "500-600"
          - "600-700"
          - "700-730"
          - "730-760"
          - "760-"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Install tmux (used by TUI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Verify docker
        run: |
          docker version
          docker info

      # Static (CGO_ENABLED=0), as released: see the Makefile's dist target.
      - name: Build fleet binary
        run: CGO_ENABLED=0 go build -o /usr/local/bin/fleet ./cmd/fleet

      - name: Run integration tests
        env:
          FLEET_BIN: /usr/local/bin/fleet
          FLEET_ITEST_RANGE: ${{ matrix.range }}
        run: ./integration/run.sh

  # The backend conformance suite (internal/backend/backendtest) against the
  # devcontainer backend on the runner's docker. Without FLEET_CONFORMANCE the
  # same test skips, so the unit workflow never needs docker for it.
  conformance-devcontainer:
    name: conformance devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Run the conformance suite
        env:
          FLEET_CONFORMANCE: devcontainer
        run: go test -count=1 -timeout 40m -v ./internal/backend/conformance

  # The Kubernetes backend's docker shim (internal/kubeshim, driven by
  # internal/backend/kubernetes/devcli) against the real devcontainer CLI and
  # docker: the capture signature of a pinned CLI version, the set-up replay,
  # the compose refusal, and the shim's option tables against docker's own
  # --help. The matrix is the oldest and newest of devcli.TestedCLIVersions
  # (the goldens in between were recorded the same way); a CLI release gets a
  # golden and a TestedCLIVersions entry before it joins. Without
  # FLEET_KUBESHIM_CLI the same tests skip, so the unit workflow never needs
  # the CLI.
  kubeshim-cli:
    name: kubeshim cli ${{ matrix.cli }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cli: ["0.85.0", "0.89.0"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install devcontainer CLI ${{ matrix.cli }}
        run: npm install -g "@devcontainers/cli@${{ matrix.cli }}"

      - name: Run the kubeshim CLI tests
        env:
          FLEET_KUBESHIM_CLI: "1"
        run: go test -count=1 -timeout 25m -v ./internal/kubeshim ./internal/backend/kubernetes/devcli

  # Image delivery against the runner's real docker and registry:2 (push,
  # digest, managed pull secret, DELETE detection, retention GC). Not in the
  # aggregate check, like kubeshim-cli.
  kubeimage-docker:
    name: kubeimage docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run the kubeimage docker tests
        env:
          FLEET_KUBEIMAGE_DOCKER: "1"
        run: go test -count=1 -timeout 10m -v -run TestRealDocker ./internal/backend/kubernetes/kubeimage

  # Single aggregate check: green only when every shard passed. Preserves one
  # stable "integration" status name for branch protection / the review loop,
  # independent of how many shards the matrix expands to.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [integration-shard]
    if: ${{ always() }}
    steps:
      - name: Verify all shards passed
        run: |
          result="${{ needs.integration-shard.result }}"
          echo "integration shard matrix result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::one or more integration shards failed (result=${result})"
            exit 1
          fi
