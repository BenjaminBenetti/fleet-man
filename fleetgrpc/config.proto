syntax = "proto3";

package fleetgrpc;

import "domain.proto";

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// CONFIG (config.json) — owned by the server for the single-writer guarantee
// =====================================================================
//
// Config mirrors internal/state.Config. It is folded into the server's
// single-writer ownership so config.json gets the SAME atomic temp+fsync+rename
// persistence and no torn-write/lost-update exposure (the #63 bug class). The
// TUI settings page mutates via SetConfig; the create job reads it server-side.
//
// CARVE-OUT: the pre-launch tmux-keybind read in cli/root.go runs BEFORE any
// server exists (to build the tmux session that LAUNCHES the TUI), so it stays a
// pure local config.json read via a pure package, NOT an RPC (chicken-and-egg).

message GeneralSettings {
  // Tri-state *bool in Go (nil defaults to true). optional preserves that.
  optional bool tmux_vim_keys = 1;
  optional bool show_help_text = 2;
}

message AgentSettings {
  // String enum in Go (e.g. "claude"); kept a plain string to avoid coupling the
  // contract to the agent-tool list, which the server validates against its own
  // allowlist (DefaultConfig forces "claude" when unknown/empty).
  string tool_selection = 1;
}

message DotfilesSettings {
  bool auto_install = 1;
  optional string repo = 2;
  optional string install_script = 3;
}

// CoderParameter mirrors internal/state.CoderParameter — one Coder template
// parameter binding. name+value are always present; the remaining fields are
// template-derived metadata (JSON `,omitempty`) and so are optional.
message CoderParameter {
  string name = 1;
  string value = 2; // may contain ${GIT_URL}, ${GIT_BRANCH}, ${INSTANCE_NAME}
  optional string default_value = 3;
  optional string display_name = 4;
  optional string description = 5;
  optional string type = 6; // "string", "number"
}

message CoderSettings {
  optional string template = 1;
  optional string preset = 2;
  // Mirrors []CoderParameter — a rich list (value + template metadata), NOT a
  // name->value map: the TUI re-renders default/display/description/type after a
  // fetch, so those must round-trip through SetConfig without loss.
  repeated CoderParameter parameters = 3;
}

message CodespacesSettings {
  optional string machine = 1;
  optional string idle_timeout = 2;
  optional string devcontainer_path = 3;
}

// BrowserSettings mirrors internal/state.BrowserSettings. Both fields are
// *bool tri-states in Go (nil defaults to false), so optional preserves the
// nil-vs-explicit-false distinction the profile-layout / prompt-suppression
// logic branches on.
message BrowserSettings {
  optional bool multiple_browsers_per_fleet = 1;
  optional bool auto_switch = 2;
}

// RemoteMcpSettings mirrors internal/state.RemoteMcpSettings — the user's intent
// to expose this daemon's local MCP server (enabled) and/or its gRPC control
// surface (fleet_enabled) to the internet through a remote fleet gateway. Both
// ride the SAME tunnel to the same gateway_url; the two toggles are independent,
// so a user can expose MCP, remote control, or both.
//
// The COMPUTED "Public MCP URL" / "Public GRPC URL" the gateway assigns on
// connect are deliberately NOT in Config — they are runtime state owned by the
// server and pushed to the TUI via the Watch RemoteMcpStatus event (watch.proto).
// Keeping them out of Config is what prevents the SetConfig-replaces-everything
// contract from clobbering them.
message RemoteMcpSettings {
  bool enabled = 1;
  string gateway_url = 2;
  // fleet_enabled gates the gateway gRPC endpoint ("Enable Remote Fleet"): when
  // false fleetd does not negotiate the grpc tunnel feature, so the gateway
  // rejects any remote `fleet` control RPCs aimed at this daemon.
  bool fleet_enabled = 3;
}

message Config {
  GeneralSettings general = 1;
  AgentSettings agent = 2;
  DotfilesSettings dotfiles = 3;
  CoderSettings coder = 4;
  CodespacesSettings codespaces = 5;
  BrowserSettings browser = 6;
  // Feeds CreateInstanceRequest's UNSPECIFIED-backend resolution. UNSPECIFIED
  // means "no default recorded" (-> DEVCONTAINER).
  BackendType default_backend = 7;
  RemoteMcpSettings remote_mcp = 8;

  reserved 9 to 20;
}

message GetConfigRequest {}

message GetConfigReply {
  Config config = 1;
}

// SetConfig replaces the whole Config (the settings page sends the full edited
// Config). Returns the post-mutation Config so the caller stays consistent.
message SetConfigRequest {
  Config config = 1;
}

message SetConfigReply {
  Config config = 1;
}
