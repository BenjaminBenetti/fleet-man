syntax = "proto3";

package fleetgrpc;

import "armada.proto";
import "control.proto";
import "watch.proto";
import "jobs.proto";
import "config.proto";
import "exec.proto";
import "kube_exec.proto";
import "output.proto";
import "inspect.proto";
import "deploy.proto";
import "kube.proto";

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// SERVICE
// =====================================================================

// FleetService is the single contract for CLI + TUI clients. It is designed
// transport-agnostically: served over a unix socket today (~/.fleet/fleet.sock)
// with NO localhost/uds assumptions, so the SAME service can be exposed over
// TCP+TLS for a remote TUI later. All inputs identify resources by name
// (fleet/instance), never by host-local paths.
service FleetService {
  // ---- Lifecycle / handshake ----
  rpc Hello(HelloRequest) returns (HelloReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);

  // FleetTUIConnected is sent ONCE when a TUI opens (not by CLI commands): a
  // hook for once-per-open, fire-and-forget server-side state reconciliation
  // (e.g. re-ensuring configured shared buildkit servers after an external
  // kill / reboot). Kept off Hello so a burst of CLI Hellos can't trigger it.
  rpc FleetTUIConnected(FleetTUIConnectedRequest) returns (FleetTUIConnectedReply);

  // GetState is the one-stop snapshot of everything the TUI renders (persisted
  // State + live runtime + active jobs).
  rpc GetState(GetStateRequest) returns (GetStateReply);

  // Watch is the server-streaming subscription that replaces TUI polling and its
  // direct backend/filesystem access. Emits Events until the client cancels or
  // the server shuts down.
  rpc Watch(WatchRequest) returns (stream Event);

  // ---- Jobs: each streams JobEvents; first event carries job_id ----
  rpc CreateInstance(CreateInstanceRequest) returns (stream JobEvent);
  rpc DestroyInstance(DestroyInstanceRequest) returns (stream JobEvent);
  rpc StartInstance(StartInstanceRequest) returns (stream JobEvent);
  rpc StopInstance(StopInstanceRequest) returns (stream JobEvent);
  rpc CloneInstance(CloneInstanceRequest) returns (stream JobEvent);
  rpc RebuildInstance(RebuildInstanceRequest) returns (stream JobEvent);

  // ---- Synchronous (non-job) state mutations ----
  rpc CreateFleet(CreateFleetRequest) returns (MutationReply);
  rpc DestroyFleet(DestroyFleetRequest) returns (MutationReply);
  rpc SetFleetSettings(SetFleetSettingsRequest) returns (MutationReply);

  // DeleteBuildkitCache wipes a fleet's shared build cache and restarts the
  // (empty) buildkit server. A synchronous host-docker action — clients use a
  // longer deadline and show progress.
  rpc DeleteBuildkitCache(DeleteBuildkitCacheRequest) returns (DeleteBuildkitCacheReply);
  // DeleteDebCache / DeleteImageCache wipe a fleet's shared deb / docker-image
  // cache and restart the (empty) server, wherever the fleet's instances reach
  // one (the daemon host's docker, each cluster). Synchronous — clients use
  // the same longer deadline as DeleteBuildkitCache.
  rpc DeleteDebCache(DeleteDebCacheRequest) returns (DeleteDebCacheReply);
  rpc DeleteImageCache(DeleteImageCacheRequest) returns (DeleteImageCacheReply);
  // GetCacheUsage reports how full each of a fleet's cache volumes is where
  // its caches run on volumes of a fixed size (its clusters), for the fleet
  // options' Caching rows.
  rpc GetCacheUsage(GetCacheUsageRequest) returns (GetCacheUsageReply);
  rpc SetInstanceMetadata(SetInstanceMetadataRequest) returns (MutationReply);
  rpc SetGroupLayout(SetGroupLayoutRequest) returns (MutationReply);
  rpc DeleteGroupLayout(DeleteGroupLayoutRequest) returns (MutationReply);
  rpc SetLastSeenVersion(SetLastSeenVersionRequest) returns (MutationReply);

  // ---- Config (server-owned config.json) ----
  rpc GetConfig(GetConfigRequest) returns (GetConfigReply);
  rpc SetConfig(SetConfigRequest) returns (SetConfigReply);

  // ---- Fleet Armada (the registry of remote fleets, armada.json) ----
  // Always served by the user's LOCAL daemon: the TUI routes these over a
  // dedicated local dial even while its main connection points at a remote
  // fleet (see armada.proto).
  rpc GetArmada(GetArmadaRequest) returns (GetArmadaReply);
  rpc SetArmada(SetArmadaRequest) returns (SetArmadaReply);
  // Resolve an ssh:// armada remote into a dialable loopback address + token
  // (the local daemon owns the SSH tunnel). Local-only, like Get/SetArmada.
  rpc ResolveArmadaRemote(ResolveArmadaRemoteRequest) returns (ResolveArmadaRemoteReply);
  // Trust one host key the daemon offered (UnknownSSHHostKey detail) for an
  // ssh:// remote, then resolve it again. Local-only, like ResolveArmadaRemote.
  rpc TrustSSHHostKey(TrustSSHHostKeyRequest) returns (TrustSSHHostKeyReply);
  // Remember / look up a remote daemon an editor alias leads to (armada.proto,
  // editor_endpoints.json). Local-only, like Get/SetArmada.
  rpc SaveEditorEndpoint(SaveEditorEndpointRequest) returns (SaveEditorEndpointReply);
  rpc ResolveEditorEndpoint(ResolveEditorEndpointRequest) returns (ResolveEditorEndpointReply);

  // Interactive approval of unknown git-host keys on THIS daemon's host.
  // Unlike Armada trust, this is available to authenticated remote clients.
  rpc GitHostKeys(stream GitHostKeyAnswer) returns (stream GitHostKeyPrompt);

  // ---- Interactive backend operations ----
  rpc Exec(stream ExecIn) returns (stream ExecOut);
  rpc ResolveExecCommand(ResolveExecCommandRequest) returns (ResolveExecCommandReply);
  rpc ResolveLogsCommand(ResolveLogsCommandRequest) returns (ResolveLogsCommandReply);
  // How the caller opens VS Code on an instance (exec.proto).
  rpc ResolveEditorLaunch(ResolveEditorLaunchRequest) returns (ResolveEditorLaunchReply);
  rpc Logs(LogsRequest) returns (stream LogLine);
  // IssueKubeExecCredential hands the daemon-host `fleet kube-exec` shim the
  // transport fleetd reaches a Kubernetes connection's API server with
  // (kube_exec.proto), so its direct-mode attaches run no credential plugin
  // of their own. Local-only: remote clients exec through Exec instead.
  rpc IssueKubeExecCredential(IssueKubeExecCredentialRequest) returns (IssueKubeExecCredentialReply);
  // PodExec runs one command in a Kubernetes instance's pod for the
  // daemon-host `fleet kube-exec` shim's daemon mode (a command without a
  // terminal: every ExecCommand of a Kubernetes instance), through the pod's
  // agent session. The first ExecIn carries pod_start. Local-only, like
  // IssueKubeExecCredential: remote clients run the same commands through
  // Exec.
  rpc PodExec(stream ExecIn) returns (stream ExecOut);

  // TriggerLogs returns an automation trigger's recorded event logs (the
  // payloads of its recent firings, concatenated for viewing). The daemon owns
  // the log files (~/.fleet/logs/<fleet>/trigger/<trigger>/), so reading them
  // over the service works unchanged when the daemon is remote.
  rpc TriggerLogs(TriggerLogsRequest) returns (TriggerLogsReply);

  // GetAutomationStatus is the automation scheduler's view of a fleet's
  // agents (every fleet's when fleet is empty), as Watch pushes it
  // (Event.automation_status): which ones the login check refuses, and how
  // many runs each has queued and running. For clients that do not watch
  // (`fleet agent list`); served to remote clients as to local ones.
  rpc GetAutomationStatus(GetAutomationStatusRequest) returns (GetAutomationStatusReply);

  // Forward is the port-forward data plane: one bidi stream per forwarded TCP
  // connection (first frame is the ForwardOpen header, the rest raw bytes).
  // The client listens locally and pipes each accepted connection through this
  // stream; the server bridges it to remote_port inside the instance.
  rpc Forward(stream ForwardChunk) returns (stream ForwardChunk);
  // Mic is the virtual-microphone data plane: the client streams captured PCM
  // up (first frame is the MicOpen header); the server streams demand signals
  // down so the client only opens the real microphone while an instance records.
  rpc Mic(stream MicUp) returns (stream MicDown);
  // ListMicSources returns the attached microphone clients and their capture
  // devices — what the Settings selector offers (also pushed over Watch).
  rpc ListMicSources(ListMicSourcesRequest) returns (ListMicSourcesReply);
  rpc Output(stream OutputUp) returns (stream OutputDown);
  rpc ListOutputTargets(ListOutputTargetsRequest) returns (ListOutputTargetsReply);
  // SSHAgent is the SSH-agent forwarding data plane: the client provides its
  // local ssh-agent, the server relays every agent connection made on its host
  // (its own git clone, processes inside instances) down this stream.
  rpc SSHAgent(stream SSHAgentUp) returns (stream SSHAgentDown);
  // CopyFile streams a single file out of an instance: first chunk is metadata,
  // the rest are data. Backs `fleet copy` and the in-instance `fc` shorthand.
  rpc CopyFile(CopyFileRequest) returns (stream CopyFileChunk);
  // CopyInto streams a single file INTO an instance — the reverse of CopyFile.
  // Client-streaming: first chunk is the open header, the rest are data. Backs
  // the scp-style upload (and instance→instance relay) direction of `fleet copy`.
  rpc CopyInto(stream CopyIntoChunk) returns (CopyIntoReply);

  // ---- Deploy targets ----
  // ListDeployTargets lists where this daemon can create an instance (judged
  // on the daemon host), the remembered default, and the daemon host's build
  // tools. Served to remote clients exactly as to local ones.
  rpc ListDeployTargets(ListDeployTargetsRequest) returns (ListDeployTargetsReply);

  // ---- Kubernetes cluster connections (kube.proto) ----
  // Served to remote clients exactly as to local ones: every RPC and every
  // field. Cluster I/O runs in fleetd, on the daemon host.

  // ListKubeContexts lists the contexts of kubeconfig files on the daemon
  // host (the context picker).
  rpc ListKubeContexts(ListKubeContextsRequest) returns (ListKubeContextsReply);
  // ListKubeClusters returns every connection with its health (also pushed
  // as Watch Event.kube_clusters).
  rpc ListKubeClusters(ListKubeClustersRequest) returns (ListKubeClustersReply);
  rpc AddKubeCluster(AddKubeClusterRequest) returns (AddKubeClusterReply);
  // UpdateKubeCluster changes the fields its FieldMask names.
  rpc UpdateKubeCluster(UpdateKubeClusterRequest) returns (UpdateKubeClusterReply);
  // RemoveKubeCluster disconnects a connection (KubeRemoveMode). Destroying
  // its instances can take minutes: clients use a long deadline.
  rpc RemoveKubeCluster(RemoveKubeClusterRequest) returns (RemoveKubeClusterReply);
  // TestKubeCluster runs the full preflight on a saved or an unsaved
  // connection, streaming each check.
  rpc TestKubeCluster(TestKubeClusterRequest) returns (stream TestKubeClusterEvent);
  // PruneKubeCluster lists, and with apply deletes, the objects labelled for
  // this daemon and connection that no instance accounts for.
  rpc PruneKubeCluster(PruneKubeClusterRequest) returns (PruneKubeClusterReply);
  // LoginKubeCluster runs the connection's login plugin on the daemon host
  // ([Run login on daemon]) and relays only its device-code URL and code.
  rpc LoginKubeCluster(LoginKubeClusterRequest) returns (stream LoginKubeClusterEvent);
  // CreateKubeNamespace creates a connection's namespace, an explicit action
  // (fleet never creates one on its own), or with dry_run only renders it.
  rpc CreateKubeNamespace(CreateKubeNamespaceRequest) returns (CreateKubeNamespaceReply);

  // ---- Shared-state sync (kube.proto; `fleet sync`) ----
  // A fleet's shared folders on its clusters, kept converged with the daemon
  // host's. Served to remote clients exactly as to local ones.

  // GetShareSync reports each fleet's sync: its folders, sides, pauses,
  // shares and conflict count.
  rpc GetShareSync(GetShareSyncRequest) returns (GetShareSyncReply);
  // WaitShareSync waits until the fleet's sides agree (`fleet sync wait`).
  rpc WaitShareSync(WaitShareSyncRequest) returns (WaitShareSyncReply);
  // ListShareConflicts lists the conflict copies kept on the daemon host.
  rpc ListShareConflicts(ListShareConflictsRequest) returns (ListShareConflictsReply);

  // ---- Repo inspection (server-side clone + checks) ----
  // InspectRepo shallow-clones remote_url on the DAEMON's host and reports
  // devcontainer presence (and optionally the detected container home dir).
  // Inspection runs where provisioning runs, so the verdict is authoritative
  // for local and remote clients alike.
  rpc InspectRepo(InspectRepoRequest) returns (InspectRepoReply);

  // ---- Coder template parameters (Coder API, read server-side) ----
  rpc GetCoderTemplateParams(GetCoderTemplateParamsRequest) returns (GetCoderTemplateParamsReply);

  // ---- Browser (container-side half of the host browser feature) ----
  rpc GetBrowserConfig(GetBrowserConfigRequest) returns (GetBrowserConfigReply);
  rpc PrepareBrowser(PrepareBrowserRequest) returns (PrepareBrowserReply);
}
