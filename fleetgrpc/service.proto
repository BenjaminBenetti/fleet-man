syntax = "proto3";

package fleetgrpc;

import "armada.proto";
import "control.proto";
import "watch.proto";
import "jobs.proto";
import "config.proto";
import "exec.proto";
import "inspect.proto";

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// SERVICE
// =====================================================================

// FleetService is the single contract for CLI + TUI clients. It is designed
// transport-agnostically: served over a unix socket today (~/.fleet/fleet.sock)
// with NO localhost/uds assumptions, so the SAME service can be exposed over
// TCP+TLS for a remote TUI later. All inputs identify resources by name
// (fleet/instance), never by host-local paths.
service FleetService {
  // ---- Lifecycle / handshake ----
  rpc Hello(HelloRequest) returns (HelloReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);

  // FleetTUIConnected is sent ONCE when a TUI opens (not by CLI commands): a
  // hook for once-per-open, fire-and-forget server-side state reconciliation
  // (e.g. re-ensuring configured shared buildkit servers after an external
  // kill / reboot). Kept off Hello so a burst of CLI Hellos can't trigger it.
  rpc FleetTUIConnected(FleetTUIConnectedRequest) returns (FleetTUIConnectedReply);

  // GetState is the one-stop snapshot of everything the TUI renders (persisted
  // State + live runtime + active jobs).
  rpc GetState(GetStateRequest) returns (GetStateReply);

  // Watch is the server-streaming subscription that replaces TUI polling and its
  // direct backend/filesystem access. Emits Events until the client cancels or
  // the server shuts down.
  rpc Watch(WatchRequest) returns (stream Event);

  // ---- Jobs: each streams JobEvents; first event carries job_id ----
  rpc CreateInstance(CreateInstanceRequest) returns (stream JobEvent);
  rpc DestroyInstance(DestroyInstanceRequest) returns (stream JobEvent);
  rpc StartInstance(StartInstanceRequest) returns (stream JobEvent);
  rpc StopInstance(StopInstanceRequest) returns (stream JobEvent);
  rpc CloneInstance(CloneInstanceRequest) returns (stream JobEvent);
  rpc RebuildInstance(RebuildInstanceRequest) returns (stream JobEvent);

  // ---- Synchronous (non-job) state mutations ----
  rpc CreateFleet(CreateFleetRequest) returns (MutationReply);
  rpc DestroyFleet(DestroyFleetRequest) returns (MutationReply);
  rpc SetFleetSettings(SetFleetSettingsRequest) returns (MutationReply);

  // DeleteBuildkitCache wipes a fleet's shared build cache and restarts the
  // (empty) buildkit server. A synchronous host-docker action — clients use a
  // longer deadline and show progress.
  rpc DeleteBuildkitCache(DeleteBuildkitCacheRequest) returns (DeleteBuildkitCacheReply);
  // DeleteDebCache / DeleteImageCache wipe a fleet's shared deb / docker-image
  // cache and restart the (empty) server. Synchronous host-docker actions —
  // clients use the same longer deadline as DeleteBuildkitCache.
  rpc DeleteDebCache(DeleteDebCacheRequest) returns (DeleteDebCacheReply);
  rpc DeleteImageCache(DeleteImageCacheRequest) returns (DeleteImageCacheReply);
  rpc SetInstanceMetadata(SetInstanceMetadataRequest) returns (MutationReply);
  rpc SetGroupLayout(SetGroupLayoutRequest) returns (MutationReply);
  rpc DeleteGroupLayout(DeleteGroupLayoutRequest) returns (MutationReply);
  rpc SetLastSeenVersion(SetLastSeenVersionRequest) returns (MutationReply);

  // ---- Config (server-owned config.json) ----
  rpc GetConfig(GetConfigRequest) returns (GetConfigReply);
  rpc SetConfig(SetConfigRequest) returns (SetConfigReply);

  // ---- Fleet Armada (the registry of remote fleets, armada.json) ----
  // Always served by the user's LOCAL daemon: the TUI routes these over a
  // dedicated local dial even while its main connection points at a remote
  // fleet (see armada.proto).
  rpc GetArmada(GetArmadaRequest) returns (GetArmadaReply);
  rpc SetArmada(SetArmadaRequest) returns (SetArmadaReply);

  // ---- Interactive backend operations ----
  rpc Exec(stream ExecIn) returns (stream ExecOut);
  rpc ResolveExecCommand(ResolveExecCommandRequest) returns (ResolveExecCommandReply);
  rpc ResolveLogsCommand(ResolveLogsCommandRequest) returns (ResolveLogsCommandReply);
  rpc Logs(LogsRequest) returns (stream LogLine);

  // Forward is the port-forward data plane: one bidi stream per forwarded TCP
  // connection (first frame is the ForwardOpen header, the rest raw bytes).
  // The client listens locally and pipes each accepted connection through this
  // stream; the server bridges it to remote_port inside the instance.
  rpc Forward(stream ForwardChunk) returns (stream ForwardChunk);
  // CopyFile streams a single file out of an instance: first chunk is metadata,
  // the rest are data. Backs `fleet copy` and the in-instance `fc` shorthand.
  rpc CopyFile(CopyFileRequest) returns (stream CopyFileChunk);

  // ---- Repo inspection (server-side clone + checks) ----
  // InspectRepo shallow-clones remote_url on the DAEMON's host and reports
  // devcontainer presence (and optionally the detected container home dir).
  // Inspection runs where provisioning runs, so the verdict is authoritative
  // for local and remote clients alike.
  rpc InspectRepo(InspectRepoRequest) returns (InspectRepoReply);

  // ---- Coder template parameters (Coder API, read server-side) ----
  rpc GetCoderTemplateParams(GetCoderTemplateParamsRequest) returns (GetCoderTemplateParamsReply);

  // ---- Browser (container-side half of the host browser feature) ----
  rpc GetBrowserConfig(GetBrowserConfigRequest) returns (GetBrowserConfigReply);
  rpc PrepareBrowser(PrepareBrowserRequest) returns (PrepareBrowserReply);
}
