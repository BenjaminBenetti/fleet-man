syntax = "proto3";

package fleetgrpc;

import "google/protobuf/timestamp.proto";
import "domain.proto";
import "deploy.proto";

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// JOBS — server-side, survive client death, re-attachable via job_id
// =====================================================================

// JobKind tags what a job is doing so a re-attaching watcher knows the shape of
// progress to expect.
enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_CREATE_INSTANCE = 1;
  JOB_KIND_DESTROY_INSTANCE = 2;
  JOB_KIND_START_INSTANCE = 3;
  JOB_KIND_STOP_INSTANCE = 4;
  JOB_KIND_CLONE_INSTANCE = 5;
  JOB_KIND_REBUILD_INSTANCE = 6;
}

// JobStep enumerates the discrete provisioning/lifecycle steps (create.Run /
// instanceops / destroy). A typed enum lets the TUI render a stable progress
// checklist; DONE marks terminal success. A provisioning job (create, clone,
// rebuild) reports each step it enters as a JobProgress and records it as its
// JobSummary.current_step, which is what an instance row shows while the job
// runs. The domain mirror is fleet.JobStep (same numbers; protoconv converts).
enum JobStep {
  JOB_STEP_UNSPECIFIED = 0;
  JOB_STEP_VALIDATE_BACKEND = 1;
  JOB_STEP_BUILD_BACKEND = 2;
  JOB_STEP_GIT_CLONE = 3;
  JOB_STEP_RESOLVE_MOUNTS = 4;
  JOB_STEP_CONTROL_MOUNT = 5;
  JOB_STEP_BACKEND_UP = 6;
  JOB_STEP_STAGE_FLEET_LAUNCH = 7;
  JOB_STEP_STAGE_FLEET_RC = 8;
  JOB_STEP_APPLY_MOUNT_SYMLINKS = 9;
  JOB_STEP_INSTALL_DOTFILES = 10;
  JOB_STEP_RUN_STARTUP_SCRIPTS = 11;
  JOB_STEP_INSTALL_CLAUDE_HOOKS = 12;
  JOB_STEP_COPY_WORKSPACE = 13;     // clone, and a file:// template's copy
  JOB_STEP_BACKEND_CLONE = 14;      // clone-only
  JOB_STEP_BACKEND_DOWN = 15;       // destroy / stop
  JOB_STEP_REMOVE_WORKSPACE = 16;   // destroy (os.RemoveAll workspaceDir)
  JOB_STEP_BACKEND_START = 17;      // start
  JOB_STEP_MARK_RUNNING = 18;
  JOB_STEP_DONE = 19;
  // 20-27 are the Kubernetes backend's provisioning steps (reported from its
  // UpContext / rebuild). Nothing emits them yet; they are declared now so a
  // client can already name them.
  JOB_STEP_IMAGE_BUILD = 20;
  JOB_STEP_IMAGE_DELIVER = 21;
  JOB_STEP_APPLY_MANIFESTS = 22;
  JOB_STEP_WAIT_POD = 23;
  JOB_STEP_SEED = 24;
  JOB_STEP_LIFECYCLE_HOOKS = 25;
  JOB_STEP_EXPORT_WORKSPACE = 26;
  JOB_STEP_ROLLBACK = 27;
  // Wiring the instance into the fleet's shared buildkit server and deb/image
  // caches (create, clone, rebuild).
  JOB_STEP_CONFIGURE_CACHES = 28;
}

// LogLevel classifies a JobLog line. WARN replaces the legacy non-fatal
// state.WriteWarn surface (the TUI's old .warn-file polling): warnings now flow
// inline on the job/Watch stream.
enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_INFO = 1;
  LOG_LEVEL_WARN = 2;
  LOG_LEVEL_ERROR = 3;
}

// JobSummary describes an in-flight (or just-completed) job so a watcher that did
// NOT launch the job can LEARN its job_id and re-attach. Carried on
// GetStateReply and the initial Watch snapshot.
message JobSummary {
  string job_id = 1;
  JobKind kind = 2;
  string fleet = 3;
  string instance = 4;
  JobStep current_step = 5;
  google.protobuf.Timestamp started_at = 6;
}

// JobEvent is one item of a job RPC's server stream. CONTRACT: the FIRST event on
// every job stream MUST be a `started` so a client whose process dies can later
// re-attach via Watch.reattach_job_ids. The terminal event is always a `done`.
// job_id is carried ONCE here, on the envelope, and is authoritative; the inner
// payloads do NOT repeat it.
message JobEvent {
  string job_id = 1;

  oneof event {
    JobStarted started = 2;
    JobProgress progress = 3;
    JobLog log = 4;
    JobDone done = 5;
  }
}

// JobStarted is the mandatory first event. It carries its own job_id so it is
// self-describing when surfaced via Event (watch.proto), whose oneof has no
// job_id envelope. Echoes kind + target + start time for labeling.
message JobStarted {
  string job_id = 1;
  JobKind kind = 2;
  string fleet = 3;
  string instance = 4;
  google.protobuf.Timestamp started_at = 5;
  // target is where a create job's instance goes: the server-resolved deploy
  // target (the remembered default when the request left it UNSPECIFIED).
  // Unset for other job kinds.
  DeployTarget target = 6;
}

// JobProgress reports advancing through a JobStep. step_done marks the step
// complete (vs just-entered) so the TUI can tick a checklist. percent is
// optional (most steps aren't quantifiable).
message JobProgress {
  JobStep step = 1;
  string message = 2;
  bool step_done = 3;
  optional float percent = 4;
}

// JobLog carries raw log output (tee'd git clone / devcontainer up /
// startup-script stdout). level distinguishes the non-fatal WARNING surface
// from info/error. One event per line, already redacted: the value of every
// docker env flag (-e KEY=VALUE) is replaced by "<redacted>". A provisioning
// job writes the same lines (and one per JobProgress step) to the instance's
// creation log on the daemon host (~/.fleet/logs/<fleet>-<instance>.log, 0600),
// which the TUI's logs view shows; the job's stream keeps only the most recent
// lines for a watcher that attaches late.
message JobLog {
  LogLevel level = 1;
  string line = 2;
  google.protobuf.Timestamp at = 3;
}

// JobDone is the terminal event. success=false carries the failure message
// persisted as Instance.error (setFailed). instance is the final authoritative
// record (e.g. ContainerID + RUNNING) so the client can update without a
// follow-up GetState. ms is wall-clock duration. warnings are non-fatal
// warnings from a SUCCESSFUL job (also persisted to Instance.warnings).
//
// DESTROY NOTE: for destroy / destroy_fleet the record is gone, so `instance` is
// omitted; success=true even if some teardown failed (best-effort): those are
// JobLog{WARN} + warnings, and the record is removed regardless.
//
// TERMINAL-TRUTH NOTE: the authoritative terminal state is the StateChanged
// snapshot (always shows RUNNING/FAILED); the job stream is best-effort progress
// UI, so a reaped/missed JobDone is harmless.
message JobDone {
  bool success = 1;
  optional string error = 2;
  Instance instance = 3;
  int64 ms = 4;
  repeated string warnings = 5;
}

// =====================================================================
// JOB REQUEST MESSAGES
// =====================================================================

// CreateInstanceRequest mirrors the inputs to create.Run / cli up. The server is
// AUTHORITATIVE: it pre-creates the StatusCreating record itself (no client-side
// state write — this is what eliminates the #63 client-write race), runs the
// job, and streams JobEvents.
//
// TARGET RESOLUTION: when backend == UNSPECIFIED the server resolves it to the
// remembered default target (config.json DefaultBackend, written only through
// remember_default) if set and valid, else BACKEND_TYPE_DEVCONTAINER; a file://
// template fleet narrows a remembered target it cannot use to devcontainer.
// ListDeployTargets reports the same default, and JobStarted.target names what
// the create resolved to. A target a new instance can't use (KUBERNETES, while
// this daemon cannot run instances on a cluster) is refused with
// INVALID_ARGUMENT before any record exists.
message CreateInstanceRequest {
  string fleet = 1;
  string instance = 2;
  // git URL, or file:///abs/dir naming a local template directory (on the
  // daemon host) that is copied into each instance instead of cloned;
  // optional — for an existing fleet the server resolves it from the fleet
  // record.
  optional string remote = 3;
  BackendType backend = 4;
  optional string branch = 5;
  bool verbose = 6;
  // remember_default makes the resolved target the remembered default (what
  // later UNSPECIFIED creates resolve to) once the create is accepted. The TUI
  // New instance dialog sets it; the CLI and MCP do not.
  bool remember_default = 7;
  // kube_cluster names the cluster connection (KubeCluster.id) a
  // BACKEND_TYPE_KUBERNETES create goes to; ignored for every other backend.
  string kube_cluster = 8;
}

// DestroyInstanceRequest destroys a single instance, or (destroy_fleet=true)
// tears down EVERY instance in the fleet and removes the fleet record in one
// job: down each container (BACKEND_DOWN), os.RemoveAll each workspace
// (REMOVE_WORKSPACE), then remove the record. Best-effort: container/workspace
// failures are JobLog{WARN} + JobDone.warnings and the record is removed anyway.
message DestroyInstanceRequest {
  string fleet = 1;
  optional string instance = 2;
  bool destroy_fleet = 3;
}

message StartInstanceRequest {
  string fleet = 1;
  string instance = 2;
}

// RebuildInstanceRequest recreates one instance's container in place. The
// backend tears down and reprovisions the container (devcontainer: `devcontainer
// up --remove-existing-container`; codespaces: `gh codespace rebuild`) while
// PRESERVING the workspace — the git checkout, uncommitted edits, and mounted
// state survive. Fleet then re-runs the post-Up provisioning (fleet-launch
// staging, dotfiles, startup scripts, Claude hooks) so the fresh container is
// equivalent to a freshly created one. Backends whose runtime has no rebuild
// primitive (coder) reject the job. Unlike destroy, the record is kept and
// flips back to RUNNING (or FAILED) on completion.
message RebuildInstanceRequest {
  string fleet = 1;
  string instance = 2;
}

message StopInstanceRequest {
  string fleet = 1;
  string instance = 2;
}

// CloneInstanceRequest clones a running source instance into a new one.
//
// COPY CONTRACT (authoritative — reproduces cli/clone.go + tui/dialogs.go): the
// server READS the source record and copies Config, Backend, KubeCluster, Tag,
// Color, and Branch into the new instance (never KubeKey: a clone's key is its
// own); DisplayName is set from new_display_name
// (falling back to new_instance); Status starts as CLONING. The optional
// override fields override the copied Tag/Color/Branch without clobbering the
// rest; absent override == use the source value.
message CloneInstanceRequest {
  string fleet = 1;
  string source_instance = 2;
  string new_instance = 3;
  optional string new_display_name = 4;
  optional string tag_override = 5;
  optional string color_override = 6;
  optional string branch_override = 7;
}
