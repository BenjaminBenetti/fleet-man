syntax = "proto3";

package fleetgrpc;

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// FLEET ARMADA (armada.json) — the LOCAL daemon's registry of remote fleets
// =====================================================================
//
// The armada is the user's registry of remote fleetd connections (gateway URL +
// bearer token) the TUI can switch between at runtime. It is client-side data
// that lives on the user's own machine: the TUI always sends Get/SetArmada to
// the LOCAL daemon, even while its main connection points at a remote fleet —
// a remote daemon has no business holding the registry of OTHER fleets.
//
// Deliberately NOT part of message Config: SetConfig replaces the whole Config,
// so an older client's settings save would silently wipe a Config-resident
// list, and a remote-connected TUI's SetConfig would write the registry to the
// wrong machine's config.json. Dedicated messages + RPCs avoid both.

// ArmadaRemote is one registered remote fleet: where it is and the bearer
// token that authenticates to the daemon behind it.
message ArmadaRemote {
  // Either a FLEET_GATEWAY-style URL (<scheme>://<host[:port]>/<session-id>)
  // for a fleet reached through a gateway, or an SSH URL
  // (ssh://[user@]host[:port]) for a fleet reached over an SSH tunnel the LOCAL
  // daemon maintains (see ResolveArmadaRemote).
  string url = 1;
  // MCP bearer token; validated by the remote daemon, never by the gateway.
  // Empty for an ssh:// remote — the token is discovered over SSH on connect.
  string token = 2;
  // forward_agent: while the TUI (or a CLI command) is connected to this
  // remote, provide the user's local ssh-agent to it over the SSHAgent stream,
  // so the remote's git clones and instances can use the user's keys (the
  // `ssh -A` of Fleet Armada). Off unless the user turns it on; a newly added
  // ssh:// remote inherits ForwardAgent from the user's ssh config for that host.
  bool forward_agent = 3;
}

// ResolveArmadaRemote turns an ssh:// armada URL into something a gRPC client
// can dial: the LOCAL daemon brings up (or reuses) an SSH port-forward to the
// remote daemon's token-gated gRPC listener, discovers the remote's bearer token
// over the same SSH connection, verifies the tunnel end-to-end, and returns the
// loopback address + token. LOCAL-ONLY: it hands out a bearer token and drives
// the user's ssh, so the tunnel-facing server refuses it (like Get/SetArmada).
message ResolveArmadaRemoteRequest {
  // The ssh://[user@]host[:port] URL (need not be registered in the armada).
  string url = 1;
}

message ResolveArmadaRemoteReply {
  // host:port on the local loopback that forwards to the remote daemon.
  string addr = 1;
  // The remote daemon's bearer token, sent as `authorization: Bearer <token>`.
  string token = 2;
}

// SSHHostKey is one public key ssh-keyscan reported for an ssh:// remote,
// with the SHA256 fingerprint ssh-keygen computed for it and the exact
// known_hosts line that would trust it.
message SSHHostKey {
  // The key algorithm as it appears in known_hosts (ssh-ed25519, ssh-rsa,
  // ecdsa-sha2-nistp256, …).
  string key_type = 1;
  // "SHA256:<base64>" — what the user must compare against the host's own
  // fingerprint before accepting.
  string fingerprint = 2;
  // "<name> <key_type> <base64 key>": the line TrustSSHHostKey appends verbatim.
  string known_hosts_line = 3;
}

// UnknownSSHHostKey rides as a status DETAIL on the FailedPrecondition that
// ResolveArmadaRemote (or TrustSSHHostKey) returns when ssh refused the remote
// because its host key is not in the daemon user's known_hosts. The daemon
// never trusts a key on its own (ssh runs in batch mode with strict checking):
// it fetches the host's keys with ssh-keyscan and hands the client what a human
// needs to decide. A CHANGED key (host known, different key) is NOT reported
// this way — that is a plain error naming the offending known_hosts line, and
// is never offered for acceptance.
message UnknownSSHHostKey {
  // The ssh:// URL the resolve was for.
  string url = 1;
  // The known_hosts lookup name ssh used, exactly as it printed it — "host" or
  // "[host]:port" for a non-default port (or a HostKeyAlias).
  string name = 2;
  // The hostname and port ssh-keyscan connected to (after ~/.ssh/config).
  string host = 3;
  uint32 port = 4;
  // The key algorithm ssh wanted (ED25519, ECDSA, RSA, …); keys lists the
  // matching key first when the host offered one of that type.
  string key_type = 5;
  repeated SSHHostKey keys = 6;
  // The known_hosts file the daemon would append to (the first
  // UserKnownHostsFile of the effective ssh config).
  string known_hosts_path = 7;
}

// TrustSSHHostKey appends one offered known_hosts line for url to the daemon
// user's known_hosts (creating ~/.ssh 0700 / the file 0600 if missing, never
// touching other lines) and then resolves the remote again, returning the
// tunnel endpoint like ResolveArmadaRemote. Only a line the daemon itself
// offered for that url (in an UnknownSSHHostKey detail) is accepted. LOCAL-ONLY.
message TrustSSHHostKeyRequest {
  string url = 1;
  string known_hosts_line = 2;
}

message TrustSSHHostKeyReply {
  string addr = 1;
  string token = 2;
}

message GetArmadaRequest {}

message GetArmadaReply {
  repeated ArmadaRemote remotes = 1;
}

// SetArmada replaces the whole registry (the settings page sends the full
// edited list). Returns the post-save list so the caller picks up the server's
// normalization.
message SetArmadaRequest {
  repeated ArmadaRemote remotes = 1;
}

message SetArmadaReply {
  repeated ArmadaRemote remotes = 1;
}
