syntax = "proto3";

package fleetgrpc;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// EXEC / LOGS / PORTFORWARD — interactive backend operations
// =====================================================================
//
// These cover the client commands that run a command inside a container (cli
// exec/shell/logs/portforward, the tmux session_* commands, the TUI
// sessions/splitpane layers). The server owns all backend access; clients drive
// it over these RPCs.

// Exec is a bidi stream for running a command inside an instance's container and
// piping stdin/stdout/stderr. The FIRST ExecIn MUST carry `start`; subsequent
// ExecIn carry stdin bytes (or resize). The server replies with ExecOut frames
// and a terminal `exit`.
//
// TTY CARVE-OUT: for interactive TTY attach (`fleet shell`, the TUI's tea.Exec),
// piping a full PTY over gRPC for a LOCAL user is wasteful — the terminal is on
// the client. For those, use ResolveExecCommand: the SERVER returns the
// ready-to-exec argv and the CLIENT execs it locally to inherit the user's TTY.
// Client-local exec for TTY attach is a PERMITTED client-host action, NOT a
// boundary violation.
message ExecIn {
  oneof msg {
    ExecStart start = 1;
    bytes stdin = 2;
    ExecResize resize = 3;
  }
}

message ExecStart {
  string fleet = 1;
  string instance = 2;
  repeated string argv = 3;
  bool tty = 4;
  map<string, string> env = 5;
}

message ExecResize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecOut {
  oneof msg {
    bytes stdout = 1;
    bytes stderr = 2;
    ExecExit exit = 3;
  }
}

message ExecExit {
  int32 code = 1;
  optional string error = 2;
}

// ResolveExecCommand returns the argv the server would exec to reach the instance
// interactively, so the CLIENT can exec it locally and inherit the user's TTY.
message ResolveExecCommandRequest {
  string fleet = 1;
  string instance = 2;
  // command to run inside; empty means "interactive login shell".
  repeated string argv = 3;
}

message ResolveExecCommandReply {
  // argv[0] is the program (e.g. devcontainer/docker/ssh); the client execs this
  // directly with inherited stdio.
  repeated string argv = 1;
  map<string, string> env = 2;
}

message LogsRequest {
  string fleet = 1;
  string instance = 2;
  bool follow = 3;
  optional int32 tail = 4;
}

message LogLine {
  string line = 1;
  google.protobuf.Timestamp at = 2;
}

// Forward is the port-forward DATA PLANE: one bidi stream per accepted TCP
// connection. The CLIENT owns the listen half (an in-process TCP proxy on
// local_port); the SERVER owns the bridge into the container; this stream is
// the pipe between them — so forwarding holds even when the server is remote
// (the old PortForward descriptor RPC assumed client host == server host).
//
// The FIRST client frame MUST carry `open` (fleet, instance, remote_port);
// every subsequent frame (both directions) carries raw bytes in `data`.
// Half-close maps naturally: the client ends its upload by closing its send
// side (CloseSend); the server signals remote EOF by ending the stream.
message ForwardChunk {
  oneof msg {
    ForwardOpen open = 1;
    bytes data = 2;
  }
}

// ForwardOpen is the setup header for one forwarded connection: which
// instance to bridge into and the port to reach inside it. There is no
// local_port — the listen side is entirely the client's business.
message ForwardOpen {
  string fleet = 1;
  string instance = 2;
  int32 remote_port = 3;
}

// CopyFile streams a file OR directory out of an instance to the client (the
// `fleet copy` / in-instance `fc` feature). The server reads through the backend
// (a tar pipe over container exec) and streams it back: the FIRST chunk carries
// `meta`, every following chunk carries `data`. For a file the data is the raw
// bytes; for a directory (meta.is_dir) it is a tar the client extracts in Go.
// Works unchanged over the remote gateway, which is the headline use case:
// pulling a built binary out of a fully remote deployment onto the local machine.
message CopyFileRequest {
  string fleet = 1;
  string instance = 2;
  // path of the file inside the instance. A relative path resolves against the
  // workspace folder (the backend exec working directory).
  string path = 3;
}

message CopyFileChunk {
  oneof msg {
    CopyFileMeta meta = 1;
    bytes data = 2;
  }
}

message CopyFileMeta {
  // name is the source's basename — the default local name.
  string name = 1;
  // mode is the source file's permission bits (so an executable stays runnable).
  // Unused when is_dir.
  uint32 mode = 2;
  // size is the file's byte count. Unused when is_dir.
  int64 size = 3;
  // is_dir marks a recursive directory copy: the data frames then carry a tar of
  // the directory (`tar -C <path> -cf - .`) instead of raw file bytes, and the
  // client extracts it in Go — skipping symlinks/special files and the `./` root
  // entry, sanitizing entry names. mode/size are unused.
  bool is_dir = 4;
}

// CopyInto streams a file OR directory INTO an instance — the reverse of
// CopyFile, the other half of scp-style `fleet copy`. It is CLIENT-streaming: the
// FIRST chunk MUST carry `open` (which instance, the destination, and the
// source's name/mode/size or is_dir); every following chunk carries `data`. The
// server resolves the destination inside the container and writes through the
// backend with a `tar -xf -` exec. For a file the data is the raw bytes (written
// atomically via a temp name + rename); for a directory (open.is_dir) it is a tar
// of the directory's contents extracted in place. Works unchanged over the remote
// gateway: pushing a local file or tree into a fully remote deployment.
message CopyIntoChunk {
  oneof msg {
    CopyIntoOpen open = 1;
    bytes data = 2;
  }
}

message CopyIntoOpen {
  string fleet = 1;
  string instance = 2;
  // dest is the destination path inside the instance. A relative path resolves
  // against the workspace folder (the backend exec working directory). When it
  // names (or is) an existing directory the file keeps `name`; otherwise dest is
  // the full target path. Empty means the workspace folder.
  string dest = 3;
  // name is the source file's basename — used when dest resolves to a directory.
  string name = 4;
  // mode is the file's permission bits to set on the written file (the perm bits
  // are honoured; a 0 mode defaults to 0644). setuid/setgid/sticky are stripped.
  // Unused when is_dir.
  uint32 mode = 5;
  // size is the source file's byte count — needed up front for the tar header,
  // and enforced as a hard cap so a truncated or oversized stream fails cleanly
  // rather than leaving a partial file. Unused when is_dir.
  int64 size = 6;
  // is_dir marks a recursive directory copy: the data frames then carry a tar of
  // the directory's CONTENTS (entries relative to the dir root, no symlinks or
  // special files, built by the client in Go), and the server resolves a target
  // directory and extracts it there with `tar -xf -` (an in-place merge, like
  // `cp -r`). mode/size are unused. NOT supported on the codespaces backend (its
  // exec PTY can silently corrupt a binary tar) — a FailedPrecondition there.
  bool is_dir = 7;
}

message CopyIntoReply {
  // path is the final absolute path written inside the instance.
  string path = 1;
  // written is the number of file bytes received and written.
  int64 written = 2;
}

// ResolveLogsCommand returns the host-side command argv the server would run to
// show an instance's container runtime logs. The client embeds it in its own
// pager script (cat the creation log, then the runtime logs) and runs it
// locally — the analog of ResolveExecCommand for the `l` logs view.
message ResolveLogsCommandRequest {
  string fleet = 1;
  string instance = 2;
}

message ResolveLogsCommandReply {
  repeated string argv = 1;
}

// TriggerLogs reads back an automation trigger's recorded event logs. Each time
// a trigger fires, the daemon writes the firing's payload (the webhook body, or
// the schedule fire-time) to a per-trigger log directory, keeping the most
// recent 100. This returns them concatenated (oldest first), so a client can
// inspect what fired an automation after the fact — the TUI's 'L' pager, the
// `fleet trigger logs` CLI, and the fleet_trigger_logs MCP tool all read here.
// A trigger that has never fired returns empty logs with count 0 (not an error).
message TriggerLogsRequest {
  string fleet = 1;
  string trigger = 2;
}

message TriggerLogsReply {
  // logs is every recorded event log concatenated (oldest first), each preceded
  // by a "===== event-<timestamp>.log =====" separator. Empty when none recorded.
  string logs = 1;
  // count is how many event logs were concatenated.
  int32 count = 2;
}

// =====================================================================
// CODER TEMPLATE PARAMETERS — read the Coder API server-side
// =====================================================================

// GetCoderTemplateParams fetches a Coder template's active-version rich
// parameters + preset names (the TUI's coder settings dialog used to call the
// coder backend's REST helpers directly). The server owns backend access.
message GetCoderTemplateParamsRequest {
  string template = 1;
}

// CoderRichParameter is the subset of a Coder rich parameter the TUI renders /
// stores (mirrors internal/backend/coder.RichParameter, minus options/required/
// mutable which the settings dialog doesn't use).
message CoderRichParameter {
  string name = 1;
  string display_name = 2;
  string description = 3;
  string type = 4;
  string default_value = 5;
}

message GetCoderTemplateParamsReply {
  repeated CoderRichParameter parameters = 1;
  repeated string presets = 2;
}

// =====================================================================
// BROWSER — the container-side half of `fleet`'s host browser feature
// =====================================================================
//
// The host browser process (Chrome) stays on the CLIENT; everything that
// touches the container — installing/starting the privoxy proxy, reading the
// workspace devcontainer.json customization, staging + running the Fleet Launch
// landing-page server — is owned by the SERVER and driven through these RPCs.

// GetBrowserConfig reads the workspace's devcontainer.json fleet customization
// so the TUI can decide whether to show the launch chooser (both an initial URL
// and a landing page are configured).
message GetBrowserConfigRequest {
  string fleet = 1;
  string instance = 2;
}

message GetBrowserConfigReply {
  // initial_url is customizations.fleet.browser.initialUrl ("" if unset).
  string initial_url = 1;
  // has_landing is true when a Fleet Launch landing page is configured.
  bool has_landing = 2;
}

// PrepareBrowser does all the container-side work for a browser open: ensure the
// privoxy proxy is installed + running, then resolve the page to open —
// honouring an explicit target_url, else the devcontainer.json initialUrl /
// Fleet Launch landing page (starting the landing-page server when chosen) /
// the default. It returns the URL the client's browser should open.
message PrepareBrowserRequest {
  string fleet = 1;
  string instance = 2;
  // prefer_fleet_launch is the fleet's resolved PreferFleetLaunch setting (the
  // tie-breaker when both an initial URL and a landing page are configured).
  bool prefer_fleet_launch = 3;
  // target_url, when set, is used verbatim (a control-socket browser.open
  // request already chose the URL) and config/landing resolution is skipped.
  optional string target_url = 4;
}

message PrepareBrowserReply {
  string initial_url = 1;
}
