syntax = "proto3";

package fleetgrpc;

import "domain.proto";
import "runtime.proto";
import "jobs.proto";

option go_package = "github.com/BenjaminBenetti/fleet-man/fleetgrpc;fleetgrpc";

// =====================================================================
// WATCH — the server-streaming subscription that replaces the TUI's polling
// (~60s live-status, ~3s stats/activity, ~1s sessions) AND its direct
// backend/filesystem access.
// =====================================================================

// WatchRequest opens a subscription.
//
// include_initial_state: emit one StateChanged snapshot, one RuntimeChanged
// snapshot (if subscribe_runtime), and one JobStarted per in-flight job up
// front — all taken in the SAME model-loop turn that registers the subscriber,
// so they reflect every mutation up to that instant and arrive before any live
// event.
//
// subscribe_runtime: opt in to the high-frequency InstanceRuntime stream
// (RuntimeChanged). The server only runs the expensive backend pollers (stats,
// agent probe, session list) while at least one subscriber wants runtime, so a
// plain `fleet ls`-style client leaves it false and the server stays quiet.
//
// reattach_job_ids: re-attach to specific jobs after a client restart. With
// include_initial_state the server advertises all in-flight jobs via JobStarted
// anyway, so this is optional convenience.
message WatchRequest {
  bool include_initial_state = 1;
  bool subscribe_runtime = 2;
  repeated string reattach_job_ids = 3;
}

// Event is the single Watch stream item. A oneof models the taxonomy so the
// stream is one ordered channel and the client switches on the active field.
//
// StateChanged carries authoritative PERSISTED snapshots (replacing state.Load
// polling) and is CONFLATABLE — for a slow consumer the server overwrites the
// pending snapshot with the newest full State rather than dropping it, so a slow
// TUI can never permanently desync.
//
// RuntimeChanged carries the high-frequency LIVE deltas (agent activity, stats,
// sessions, ports), kept SEPARATE from StateChanged so a 3s stat tick doesn't
// resend the whole persisted State. Only sent when subscribe_runtime is set.
//
// The Job* variants surface job activity to a watcher that did not itself start
// the job. JobStarted is here (not only on the job RPC) so a Watch-only client
// learns a job's identity/kind/target/started_at.
//
// BrowserOpen is pushed when the server's per-instance control listener receives
// a browser.open envelope from inside a container; the SERVER owns the control
// socket and resolves the URL, the CLIENT execs its local browser — the correct
// split for the remote-TUI goal.
//
// RemoteMcpStatus carries the live state of the outbound MCP gateway tunnel,
// including the gateway-assigned Public MCP URL. It is a server-owned, push-only
// COMPUTED value (never a Config field), so the settings page renders whatever
// the latest pushed status says without any SetConfig read-back. Conflatable
// (newest status wins) and cached by the hub for the initial snapshot.
message Event {
  oneof kind {
    StateChanged state_changed = 1;
    JobStarted job_started = 2;
    JobProgress job_progress = 3;
    JobLog job_log = 4;
    JobDone job_done = 5;
    BrowserOpen browser_open = 6;
    RuntimeChanged runtime_changed = 7;
    RemoteMcpStatus remote_mcp_status = 8;
    FileCopy file_copy = 9;
  }
}

// RemoteMcpConn is the connection state of the outbound MCP gateway tunnel.
enum RemoteMcpConn {
  REMOTE_MCP_CONN_UNSPECIFIED = 0; // feature off / not connected (the default)
  REMOTE_MCP_CONN_CONNECTING = 1; // enabled, dialing/registering with the gateway
  REMOTE_MCP_CONN_CONNECTED = 2; // tunnel up; public_url is live
  REMOTE_MCP_CONN_ERROR = 3; // enabled but the last attempt failed; error is set
}

// RemoteMcpStatus is the computed status the settings page shows after the user
// enables remote MCP and/or remote fleet (both share the one gateway tunnel, so
// one status describes them). public_url is the gateway-assigned Public MCP URL
// and public_grpc_url the Public GRPC URL a remote `fleet` dials (each only
// meaningful when state is CONNECTED; public_grpc_url is empty unless the grpc
// feature was negotiated and the gateway runs with --public-grpc-url); error
// carries the last failure (when state is ERROR).
message RemoteMcpStatus {
  RemoteMcpConn state = 1;
  string public_url = 2;
  string error = 3;
  string public_grpc_url = 4;
}

// StateChanged is pushed whenever the authoritative PERSISTED model mutates. It
// carries the full State (simple, race-free for a small model) so the client
// never reconciles partial deltas — directly replacing state.Load reloads.
message StateChanged {
  State state = 1;
}

// RuntimeChanged carries refreshed live runtime for one or more instances. Like
// StateChanged it is conflatable (the server coalesces per-instance updates for
// a slow consumer). May carry a single instance (a 3s stat tick) or the full set
// (the initial snapshot).
message RuntimeChanged {
  repeated InstanceRuntime runtime = 1;
}

// BrowserOpen asks the receiving client to open a URL in its local browser. The
// server computes url + the customization hints the TUI's browser layer used
// (data dir / profile) so the client just launches the browser.
message BrowserOpen {
  string url = 1;
  optional string data_dir = 2;
  // fleet/instance label which workspace requested the open.
  string fleet = 3;
  string instance = 4;
}

// FileCopy asks the receiving client to pull a file out of an instance to its
// local disk. Pushed when the server's per-instance control listener receives a
// file.copy envelope from an in-container `fleet copy` (fc); the CLIENT then
// fetches the bytes itself via the CopyFile RPC and writes them to its downloads
// folder — the same control-socket → Watch → client-action split as BrowserOpen,
// which is what makes fc work for fully remote deployments.
message FileCopy {
  // fleet/instance label which workspace requested the copy.
  string fleet = 1;
  string instance = 2;
  // path is the absolute in-instance path of the file to copy (resolved by the
  // in-instance sender, so the server-side exec needs no cwd context).
  string path = 3;
  // dest is the optional destination on the receiving client's machine; ""
  // means the client's downloads folder. The client interprets it scp-style:
  // absolute is used as-is, ~/ and relative paths resolve against the client
  // user's home, and a directory keeps the source basename.
  string dest = 4;
}
